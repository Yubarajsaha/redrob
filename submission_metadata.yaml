# Approach summary

methodology_summary: |
  Three-stage pipeline that ranks 100K candidates to a Top 100 shortlist.

  Stage 1 (Fast Filter): Rule-based filter cuts 100K to ~19K candidates in 5.6s.
  Removes honeypots (impossible timelines, identical assessments), inactive profiles
  (>180 days), out-of-range experience, consulting-only careers, and irrelevant skills.
  Caught 13,579 honeypots from the pool.

  Stage 2a (Semantic Embedding): all-MiniLM-L6-v2 embeds full candidate narratives
  (headline + summary + career descriptions + skills) and computes cosine similarity
  against the JD embedding. Pre-computed offline for speed.

  Stage 2b (Deep Career Scoring): Reads actual career descriptions to score:
  product-company vs consulting ratio, retrieval/search/ranking system evidence,
  pre-LLM ML experience, production deployment evidence, career progression,
  startup fit, and tenure stability.

  Stage 3 (Behavioral Signals): Scores platform activity, open-to-work status,
  recruiter response rate, interview completion rate, GitHub activity, notice period,
  and relocation willingness.

  Final score: 40% semantic + 25% career quality + 20% behavioral + 15% skills depth.
  Ranking step completes in 5.8 seconds on CPU, well within 5-minute constraint.


